name: Windows checks and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run verify
      # Packaging CI has no release signing key. Signed updates must also pass
      # release:manifest's verification before a release is published.
      - run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: filezy-windows-x64
          path: |
            src-tauri/target/release/filezy.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
